aid: dapper-labs
name: Dapper Labs
description: >-
  Dapper Labs is the blockchain company behind the Flow network and a portfolio of
  consumer NFT experiences including NBA Top Shot, NFL All Day, Disney Pinnacle, and
  LaLiga Golazos. Its primary public developer surface is the Flow Access API — a
  public, unauthenticated blockchain node API available over REST (rest-mainnet.onflow.org),
  gRPC, and WebSocket event streaming — used to read on-chain data (blocks, transactions,
  accounts, collections, events), execute read-only Cadence scripts, and submit signed
  Cadence transactions. Flow and its client tooling (FCL, the Flow CLI, Go/JS SDKs) are
  maintained under the onflow GitHub organization. This profile began as a VC-portfolio
  stub and has been enriched by the API Evangelist pipeline from Dapper/Flow's real
  developer artifacts.
